[package]
name = "hongguo-playback"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-only"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
android-jni = ["dep:jni"]
models = ["dep:base64", "dep:serde_json", "dep:url"]
registered = ["web", "dep:aes", "dep:cbc", "dep:ctr", "dep:md-5", "dep:sha2", "dep:sm3", "dep:flate2", "dep:rand", "dep:tokio", "dep:uuid"]
web = ["models", "dep:anyhow", "dep:reqwest", "dep:serde"]

[dependencies]
aes = { version = "0.8", optional = true }
cbc = { version = "0.1", features = ["alloc"], optional = true }
ctr = { version = "0.9", optional = true }
md-5 = { version = "0.10", optional = true }
sha2 = { version = "0.10", optional = true }
sm3 = { version = "0.4", optional = true }
flate2 = { version = "1", optional = true }
rand = { version = "0.8", optional = true }
tokio = { version = "1", features = ["sync", "time"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
anyhow = { version = "1.0", optional = true }
base64 = { version = "0.22", optional = true }
jni = { version = "0.21.1", optional = true }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "cookies", "gzip", "brotli", "stream"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
url = { version = "2.5", optional = true }

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
