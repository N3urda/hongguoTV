<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>hongguoTV</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="shell" class="shell">
    <header class="app-bar">
      <button type="button" class="brand" data-section="home" aria-label="红果短剧首页">
        <img src="brand.png" alt="" width="32" height="30"><span>红果短剧</span>
      </button>
      <nav class="app-nav" aria-label="主导航">
        <button type="button" data-section="home" aria-current="page">首页</button>
        <button type="button" data-section="browse">找剧</button>
        <button type="button" data-section="rank">排行榜</button>
        <button type="button" data-section="feed">随心看</button>
      </nav>
      <div class="app-actions">
        <button class="global-search" type="button" data-section="search" aria-label="搜索剧集">
          <span class="icon icon-search" aria-hidden="true"></span><span>搜索剧集</span><kbd>Ctrl K</kbd>
        </button>
        <button class="icon-button" type="button" data-section="library" title="我的" aria-label="我的"><span class="icon icon-person" aria-hidden="true"></span></button>
        <button class="icon-button" type="button" data-section="settings" title="设置" aria-label="设置"><span class="icon icon-settings" aria-hidden="true"></span></button>
      </div>
    </header>
    <main id="main" class="workspace" tabindex="-1"></main>
  </div>
  <section id="watch" class="watch" aria-label="播放器" hidden></section>
</body>
</html>
