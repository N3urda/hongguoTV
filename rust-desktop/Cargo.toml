[package]
name = "hongguo-desktop"
version = "0.4.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-only"
description = "Hongguo TV desktop client for macOS and Windows"

[features]
default = ["desktop"]
desktop = ["dep:tao", "dep:wry"]

[dependencies]
anyhow = "1.0"
async-stream = "0.3"
axum = "0.8.9"
base64 = "0.22"
hongguo-playback = { path = "../rust-core" }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "cookies", "gzip", "brotli", "stream"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.23"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "time", "sync", "signal", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tao = { version = "0.37.3", optional = true }
wry = { version = "0.57.3", optional = true, default-features = false, features = ["os-webview"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[profile.release]
strip = true
lto = "thin"
