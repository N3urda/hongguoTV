name: Verify Rust desktop

on:
  push:
    branches: [main, codex/rust-desktop]
    paths:
      - 'rust-core/**'
      - 'rust-desktop/**'
      - '.github/workflows/rust-desktop.yml'
      - 'assets/brand/logo-pixel.png'
      - 'kotlin-tv/app/src/main/res/drawable-nodpi/brand_mark.png'
  pull_request:
    paths:
      - 'rust-core/**'
      - 'rust-desktop/**'
      - '.github/workflows/rust-desktop.yml'
      - 'assets/brand/logo-pixel.png'
      - 'kotlin-tv/app/src/main/res/drawable-nodpi/brand_mark.png'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rust-desktop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo +stable fmt --manifest-path ../rust-core/Cargo.toml --check
      - run: cargo +stable clippy --manifest-path ../rust-core/Cargo.toml --locked --all-targets --features android-jni -- -D warnings
      - run: cargo +stable test --manifest-path ../rust-core/Cargo.toml --locked --features android-jni
      - run: cargo +stable fmt --check
      - run: cargo +stable clippy --locked --no-default-features --all-targets -- -D warnings
      - run: cargo +stable test --locked --no-default-features
      - run: node --input-type=module --check < ui/app.js
      - run: node --input-type=module --check < ui/settings.js

  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: rustup toolchain install stable --profile minimal
      - run: rustup target add --toolchain stable ${{ matrix.target }}
      - run: cargo +stable test --manifest-path rust-desktop/Cargo.toml --locked
      - if: runner.os == 'macOS'
        run: python rust-desktop/package.py --target ${{ matrix.target }}
        env:
          RUSTUP_TOOLCHAIN: stable
      - name: Build Windows Setup
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUSTUP_TOOLCHAIN: stable
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH += ";$(Join-Path ${env:ProgramFiles(x86)} 'NSIS')"
          $bootstrapper = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
          Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $bootstrapper
          $signature = Get-AuthenticodeSignature $bootstrapper
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '(^|,\s*)CN=Microsoft Corporation(,|$)') {
            throw 'WebView2 bootstrapper is missing a valid Microsoft signature'
          }
          python rust-desktop/package.py --target ${{ matrix.target }} --webview2-bootstrapper $bootstrapper
      - name: Install and verify Windows Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem 'outputs/rust-desktop/*-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Windows Setup artifact is missing' }
          $installDir = Join-Path $env:LOCALAPPDATA 'Programs\hongguoTV'
          $install = Start-Process $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Setup failed ($($install.ExitCode))" }
          $app = Join-Path $installDir 'Hongguo Rust.exe'
          $uninstaller = Join-Path $installDir 'Uninstall.exe'
          if (-not (Test-Path $app) -or -not (Test-Path $uninstaller)) { throw 'Setup payload is missing' }
          $version = Start-Process $app -ArgumentList '--version' -Wait -PassThru
          if ($version.ExitCode -ne 0) { throw "Installed app failed ($($version.ExitCode))" }
          Start-Process $uninstaller -ArgumentList '/S' -Wait
          if (Test-Path $app) { throw 'Uninstall left the application executable' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Hongguo-Rust-${{ matrix.artifact }}
          path: outputs/rust-desktop/*
          if-no-files-found: error
