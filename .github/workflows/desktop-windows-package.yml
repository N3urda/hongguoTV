name: Package Windows desktop
on:
  push:
    branches: [codex/kmp-shared-core-plan]
    paths:
      - '.github/workflows/desktop-windows-package.yml'
      - 'kotlin-tv/app-desktop/**'
      - 'kotlin-tv/core/**'
  workflow_dispatch:
    inputs:
      live_playback:
        description: Verify real playback in the packaged Windows window
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Test and package portable exe with runtime
        shell: pwsh
        run: |
          ./kotlin-tv/gradlew.bat -p kotlin-tv :app-desktop:test :core:test :app-desktop:createDistributable --console=plain
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          $app = 'kotlin-tv/app-desktop/build/compose/binaries/main/app/HongguoDesktop'
          if (!(Test-Path "$app/HongguoDesktop.exe")) { throw 'Missing desktop exe' }
          if (!(Get-ChildItem $app -Filter "mediamp-mpv-runtime-windows-x64-0.5.1*.jar" -Recurse)) { throw 'Player was not packaged' }
          Copy-Item LICENSE "$app/LICENSE.txt"
          @('解压整个文件夹后，双击 HongguoDesktop.exe。不要只复制 exe 文件。', '支持 Windows x64，已附带 Java 运行时和内嵌播放器。', '本包是未签名试用版。账号及 Windows 实机体验仍需验证。') | Set-Content "$app/使用说明.txt" -Encoding utf8
          Compress-Archive -Path $app -DestinationPath HongguoDesktop-Windows-x64.zip
          (Get-FileHash HongguoDesktop-Windows-x64.zip -Algorithm SHA256).Hash | Set-Content HongguoDesktop-Windows-x64.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: HongguoDesktop-Windows-x64
          path: |
            HongguoDesktop-Windows-x64.zip
            HongguoDesktop-Windows-x64.sha256
          if-no-files-found: error
      - name: Verify real playback in the packaged app
        if: inputs.live_playback
        shell: pwsh
        timeout-minutes: 6
        run: |
          $exe = 'kotlin-tv/app-desktop/build/compose/binaries/main/app/HongguoDesktop/HongguoDesktop.exe'
          $process = Start-Process $exe -ArgumentList '--smoke-controller' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Embedded playback failed ($($process.ExitCode))" }
