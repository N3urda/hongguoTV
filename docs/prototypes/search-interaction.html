<!DOCTYPE html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>红果 TV · 搜索交互示意</title><style>
*{box-sizing:border-box}body{margin:0;background:#101114;color:#f4f3ef;font:16px system-ui,sans-serif}button{font:inherit;cursor:pointer;color:inherit;border:1px solid #37383e;background:#25262c;border-radius:9px}button:focus{outline:3px solid #fff;outline-offset:3px;background:#f4f3ef;color:#15161a;box-shadow:0 0 0 7px #ffffff12}header{display:flex;justify-content:space-between;padding:22px 4%;border-bottom:1px solid #303137}header b{letter-spacing:2px}small,.muted{color:#999ca7}main{max-width:1280px;margin:auto;padding:35px 4%}h1{font-size:34px;margin:0 0 8px}h2{font-size:24px;margin:0}p{color:#aaaeb8}#workspace{display:grid;grid-template-columns:300px 1fr;gap:52px;margin-top:30px}#query{background:#202127;border:1px solid #555861;border-radius:10px;min-height:57px;padding:15px;font-size:21px;margin-bottom:20px;overflow-wrap:anywhere}.keys{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.keys button{height:42px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}.actions button{height:43px}#words{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin-top:24px}#words button{text-align:left;min-height:78px;padding:15px 20px;line-height:1.45;font-size:19px;display:flex;gap:16px;align-items:center}button em{font-size:12px;font-style:normal;opacity:.5}.caption{display:flex;justify-content:space-between;align-items:center}.badge{font-size:12px;background:#313239;padding:6px 10px;border-radius:20px;color:#b9bbc5}.hint{font-size:13px;margin-top:24px;line-height:1.8}footer{margin-top:32px;padding:18px 0;border-top:1px solid #32333a;display:flex;justify-content:space-between;color:#b0b3bd;font-size:14px}kbd{background:#303138;border-radius:4px;padding:3px 6px;color:white}#results{display:none}#cards{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:28px}.poster{height:235px;display:flex;align-items:center;justify-content:center;font-size:30px;writing-mode:vertical-rl;letter-spacing:8px;background:linear-gradient(145deg,#514a56,#25232b);border-radius:8px}.result{padding:9px;text-align:left}.result strong{display:block;margin:12px 4px}.result small{display:block;margin:8px 4px}#back{padding:10px 20px}.demo{max-width:1280px;margin:0 auto;padding:0 4% 24px;display:flex;gap:10px;align-items:center;font-size:13px}.demo button{padding:8px 12px}#notice{color:#c7bfad} @media(max-width:800px){#workspace{grid-template-columns:230px 1fr;gap:24px}#words button{font-size:16px;padding:10px}#cards{grid-template-columns:repeat(2,1fr)}main{padding-top:20px}}
</style><header><b>红果 TV <span style="color:#f16c6b"> / 搜索</span></b><small>交互示意 · 示例数据，不连接真实搜索</small></header><main><section id="search"><h1>下一部想看的，从这里开始</h1><p>输入剧名或拼音首字母，也可以直接选择最近搜索</p><div id="workspace"><aside><div id="query" aria-live="polite"></div><div class="keys" id="keys"></div><div class="actions" id="actions"></div><div class="hint">到键盘右边缘，按 <kbd>→</kbd> 进入选词<br>从词块左边缘按 <kbd>←</kbd> 回到刚才的键位</div></aside><div><div class="caption"><h2 id="heading"></h2><span class="badge" id="count"></span></div><div id="words"></div><p class="hint" id="wordhint"></p></div></div></section><section id="results"><div class="caption"><div><h1 id="resultTitle"></h1><p>选择想看的剧集</p></div><button id="back">← 返回选词</button></div><div id="cards"></div></section><footer><span><kbd>↑ ↓ ← →</kbd> 移动　<kbd>Enter</kbd> 确认　<kbd>Esc</kbd> 返回</span><span id="status">输入 / 选词</span></footer></main><div class="demo"><span>快速体验</span><button id="example">输入示例「ch」</button><button id="reset">恢复初始状态</button><span id="notice">也可直接点击，或使用电脑键盘输入字母。</span></div><script>
const $=id=>document.getElementById(id);const history=['重生之我在古代当首富','春日来信','闪婚后总裁身份藏不住了','她的逆袭人生','长风渡山河','回到九零当学霸','我们的烟火人间','晚风与你皆温柔'];const suggest=['春日来信','春风不负有心人','重回十八岁那年','穿越后我成了全村的希望','长风渡山河','重生之我在古代当首富','迟来的告白','此生与你共白头'];let query='',lastKey=0,restore=null,inResults=false;
function button(text,zone,i,fn){const b=document.createElement('button');b.textContent=text;b.dataset.zone=zone;b.dataset.i=i;b.onclick=fn;b.onfocus=()=>{if(zone==='key')lastKey=i};return b}
function focus(zone,i){document.querySelector(`[data-zone="${zone}"][data-i="${i}"]`)?.focus()}
'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'.split('').forEach((v,i)=>$('keys').append(button(v,'key',i,()=>{query+=v.toLowerCase();render()})));
['删除','清空','搜索'].forEach((v,i)=>$('actions').append(button(v,'action',i,()=>{if(i===0)query=query.slice(0,-1);if(i===1)query='';if(i===2){if(query)showResults(query);return}render()})));
function render(){const current=document.activeElement;const wi=current?.dataset.zone==='word'?Number(current.dataset.i):null;$('query').textContent=query||'剧名 / 拼音首字母';$('query').style.color=query?'#fff':'#858994';$('heading').textContent=query?'猜你想搜':'最近搜索';$('count').textContent='8 个词 · 全部可见';$('wordhint').textContent=query?'两列浏览，按确认直接搜索。示例联想用于体验焦点路径。':'历史一屏展开；开始输入后，这里切换为联想词。';$('words').replaceChildren();(query?suggest:history).forEach((v,i)=>{const b=button('','word',i,()=>showResults(v));const n=document.createElement('em');n.textContent=String(i+1).padStart(2,'0');const t=document.createElement('span');t.textContent=v;b.append(n,t);$('words').append(b)});if(wi!==null)focus('word',wi)}
function showResults(term){restore={zone:document.activeElement?.dataset.zone||'word',i:Number(document.activeElement?.dataset.i||0)};inResults=true;$('search').style.display='none';$('results').style.display='block';$('status').textContent='搜索结果 · 返回可继续选词';$('resultTitle').textContent='“'+term+'” 的搜索结果';$('cards').replaceChildren();[term,term+' · 续篇','与你有关的故事','时光里的答案'].forEach((v,i)=>{const b=button('','result',i,()=>{$('notice').textContent='已选择《'+v+'》；此处为交互示意，不播放视频。'});b.className='result';const p=document.createElement('div');p.className='poster';p.textContent=v.slice(0,7);p.style.background=`linear-gradient(145deg,hsl(${i*45+210} 18% 32%),#202126)`;const title=document.createElement('strong');title.textContent=v;const sub=document.createElement('small');sub.textContent='共 '+(60+i*8)+' 集 · 示例剧集';b.append(p,title,sub);$('cards').append(b)});focus('result',0)}
function back(){if(!inResults)return;inResults=false;$('results').style.display='none';$('search').style.display='block';$('status').textContent='已恢复选词位置';focus(restore.zone,restore.i)}$('back').onclick=back;
function move(key){const el=document.activeElement,z=el?.dataset.zone,i=Number(el?.dataset.i||0);if(inResults){if(z==='result'){if(key==='ArrowLeft')focus(z,Math.max(0,i-1));if(key==='ArrowRight')focus(z,Math.min(3,i+1));if(key==='ArrowUp')$('back').focus()}else if(key==='ArrowDown')focus('result',0);return}if(z==='key'){if(key==='ArrowRight')i%6===5?focus('word',0):focus(z,i+1);if(key==='ArrowLeft')focus(z,i%6===0?i:i-1);if(key==='ArrowUp')focus(z,Math.max(i%6,i-6));if(key==='ArrowDown')i<30?focus(z,i+6):focus('action',Math.min(2,Math.floor(i%6/2)))}else if(z==='word'){if(key==='ArrowLeft')i%2===0?focus('key',lastKey):focus(z,i-1);if(key==='ArrowRight')focus(z,i%2===0?i+1:i);if(key==='ArrowUp')focus(z,Math.max(i%2,i-2));if(key==='ArrowDown')focus(z,Math.min(6+i%2,i+2))}else if(z==='action'){if(key==='ArrowUp')focus('key',30+i*2);if(key==='ArrowLeft')focus(z,Math.max(0,i-1));if(key==='ArrowRight')i===2?focus('word',0):focus(z,i+1)}else focus('key',lastKey)}
document.addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')){e.preventDefault();move(e.key)}else if(e.key==='Escape'){e.preventDefault();if(inResults)back();else focus('key',lastKey)}else if(!inResults&&/^[a-z0-9]$/i.test(e.key)&&!e.ctrlKey&&!e.metaKey){query+=e.key.toLowerCase();render()}else if(!inResults&&e.key==='Backspace'){e.preventDefault();query=query.slice(0,-1);render()}});$('example').onclick=()=>{back();query='ch';render();focus('key',5)};$('reset').onclick=()=>{back();query='';lastKey=0;render();focus('key',0);$('notice').textContent='也可直接点击，或使用电脑键盘输入字母。'};render();focus('key',0);
</script></html>
